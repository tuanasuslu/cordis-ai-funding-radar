name: Weekly CORDIS Data & AI Funding Radar

on:
  schedule:
    # Every Monday 09:00 Europe/Istanbul (UTC+3) = 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the radar
        run: python cordis_ai_funding_radar.py --countries DE,AT,CH --output ai_funding_radar_dach.xlsx

      - name: Commit refreshed output (if changed)
        run: |
          git config user.name "cordis-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai_funding_radar_dach.xlsx
          git diff --cached --quiet && echo "No changes, skipping commit." || git commit -m "Weekly CORDIS data & AI funding radar update ($(date -u +%Y-%m-%d))"
          git push
